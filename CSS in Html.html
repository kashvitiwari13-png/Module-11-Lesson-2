     <style>
        /*Universal Selector*/

        font-family: cursive;
    }
    /*universal selector*/

    }
    /*class selector*/
    .myclass{
        border: 3px solid orange ;
    }
    /*id selector*/
    #myid {
        background-color: blueviolet;
    }
     </style>
</head>
<body>

        <P> Hello I am the God</P>

         <h2 class="myclass">Hello what is your name?</h2>
         <h1 class="myclass">What is your brother's name? </h1>
        
</body>
